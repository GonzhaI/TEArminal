name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: CI solo lee el repositorio
permissions:
  contents: read

jobs:
  test:
    # windows-2022 (base Windows 10/Server 2022) y windows-latest (Windows Server 2025): ambos traen
    # powershell.exe 5.1 y pwsh 7, y los tests de PTY ejercitan el script de inicio en cada uno.
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Versiones de PowerShell disponibles
        shell: pwsh
        run: |
          powershell.exe -NoProfile -Command '"Windows PowerShell " + $PSVersionTable.PSVersion'
          "PowerShell " + $PSVersionTable.PSVersion

      - name: Tests (incluye ConPTY real con powershell.exe 5.1 y pwsh 7)
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: tearminal.exe no debe depender del Visual C++ Redistributable
        shell: pwsh
        run: |
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('target/release/tearminal.exe'))
          if ($text -match '(?i)vcruntime140|msvcp140') { throw 'tearminal.exe importa el runtime de Visual C++ (falta crt-static)' }
          "OK: ejecutable autónomo ({0:N1} MB)" -f ((Get-Item target/release/tearminal.exe).Length / 1MB)

  lint:
    name: Formato y lints
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  package:
    # El empaquetado depende de descargas externas (herramientas con hash fijo) e Inno Setup: se prueba
    # en cada cambio para que un enlace roto no se descubra el día de la release.
    name: Package (instalador + ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Versión fija: el compilador del instalador cambia el .exe resultante (misma política que `tools.json`).
      # Al subirla, prueba `packaging/test-installer.ps1`. Sin `if (Test-Path ISCC)`: el runner puede traer otra.
      - name: Inno Setup (versión fija)
        shell: pwsh
        env:
          INNO_VERSION: '6.7.1'
        run: |
          choco install innosetup --version=$env:INNO_VERSION --allow-downgrade --no-progress -y
          $installed = (choco list innosetup --exact --limit-output)
          if ($installed -ne "InnoSetup|$env:INNO_VERSION") { throw "Inno Setup instalado: '$installed', se esperaba $env:INNO_VERSION" }

      - name: Empaquetar
        shell: pwsh
        run: ./packaging/package.ps1

      - name: Probar el instalador (instalar, ejecutar, desinstalar)
        shell: pwsh
        run: ./packaging/test-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: tearminal-windows-x64
          path: |
            dist/tearminal-setup-*.exe
            dist/tearminal-*-windows-x64.zip
            dist/SHA256SUMS.txt
