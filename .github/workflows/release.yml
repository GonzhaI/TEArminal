name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package Release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "axon-$tag-windows-x64.zip"
          Compress-Archive -Path "target/release/axon.exe", "axon.toml", "README.md" -DestinationPath $zipName
          Write-Host "Created asset: $zipName"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/axon.exe
            axon-*-windows-x64.zip
          generate_release_notes: true
