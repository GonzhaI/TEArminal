name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0

      - name: La etiqueta debe coincidir con la versión de Cargo.toml
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ('${{ github.ref_name }}' -ne "v$cargo") { throw "Etiqueta ${{ github.ref_name }} != v$cargo (Cargo.toml)" }

      - name: Tests
        run: cargo test

      # Versión fija: el compilador del instalador cambia el .exe resultante (misma política que `tools.json`).
      # Al subirla, prueba `packaging/test-installer.ps1`. Sin `if (Test-Path ISCC)`: el runner puede traer otra.
      - name: Inno Setup (versión fija)
        shell: pwsh
        env:
          INNO_VERSION: '6.7.1'
        run: |
          choco install innosetup --version=$env:INNO_VERSION --allow-downgrade --no-progress -y
          $installed = (choco list innosetup --exact --limit-output)
          if ($installed -ne "InnoSetup|$env:INNO_VERSION") { throw "Inno Setup instalado: '$installed', se esperaba $env:INNO_VERSION" }

      - name: Empaquetar (ZIP portable + instalador + herramientas verificadas)
        shell: pwsh
        run: ./packaging/package.ps1

      - name: Probar el instalador (instalar, ejecutar, desinstalar)
        shell: pwsh
        run: ./packaging/test-installer.ps1

      - name: Publicar release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/tearminal-setup-*.exe
            dist/tearminal-*-windows-x64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
