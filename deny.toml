# Configuración de cargo-deny para Axon
# Auditoría de licencias, vulnerabilidades (RustSec) y dependencias duplicadas.

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
ignore = [
    # Upstream crates de renderizado tipográfico y emulación de terminal
    "RUSTSEC-2026-0206", # rustybuzz
    "RUSTSEC-2017-0008", # serial (portable-pty)
    "RUSTSEC-2026-0192", # ttf-parser (fontdue)
]
yanked = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
