[package]
name = "axon"
version = "0.12.0"
edition = "2021"
description = "Axon: Terminal nativa veloz para Windows optimizada para agentes CLI"
authors = ["Axon Team"]
repository = "https://github.com/GonzhaI/axon"
readme = "README.md"
keywords = ["terminal", "powershell", "conpty", "windows"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
# Backend de emulación de terminal y Windows ConPTY
portable-pty = "0.8"
vte = "0.14"

# Ventana nativa sin capas de GUI
winit = "0.30"
fontdue = "0.9"
rustybuzz = "0.18"

# Integración nativa de Windows 11 (DWM Dark Mode, Win32)
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

# DirectX 11 y DXGI para renderizado por GPU nativo en Windows 11 (DirectFlip)
windows = { version = "0.52", default-features = false, features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }

# Portapapeles del sistema nativo
arboard = "3.6"

# Configuración ligera en TOML
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"

# Soporte para protocolos gráficos de imagen (PNG, JPEG, decodificación base64)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# Soporte tipográfico Unicode completo, anchos y clústeres de grafemas
unicode-width = "0.1"
unicode-segmentation = "1.12"

# Optimización para binarios de producción (GitHub Releases)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winres = "0.1.12"
