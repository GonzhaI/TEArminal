[package]
name = "axon"
version = "0.2.0"
edition = "2021"
description = "Axon: Terminal veloz, ligera y con aceleración GPU para Windows optimizada para agentes CLI"
authors = ["Axon Team"]

[dependencies]
# Backend de emulación de terminal y Windows ConPTY
portable-pty = "0.8"
vte = "0.14"

# Interfaz gráfica y renderizado nativo acelerado por GPU (DirectX 12 / Vulkan vía wgpu)
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wgpu",
] }
egui = "0.29"

# Configuración ligera en TOML
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"

# Soporte para protocolos gráficos de imagen (PNG, JPEG, decodificación base64)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# Soporte tipográfico Unicode completo y anchos de caracteres (emojis, CJK, Nerd Fonts)
unicode-width = "0.1"


