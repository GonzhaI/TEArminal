[package]
name = "tearminal"
version = "0.29.3"
edition = "2021"
license = "MIT"
description = "TEArminal: Workspace y terminal nativa veloz para Windows optimizada para agentes CLI y PowerShell"
authors = ["TEArminal Team"]
repository = "https://github.com/GonzhaI/TEArminal"
readme = "README.md"
keywords = ["terminal", "powershell", "conpty", "windows"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
# Backend de emulación de terminal y Windows ConPTY
portable-pty = "0.8"
vte = "0.14"

# Ventana nativa sin capas de GUI
winit = "0.30"
fontdue = "0.9"
rustybuzz = "0.18"

# Integración nativa de Windows 11 (DWM Dark Mode, Win32)
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    # Módulo de datos: Administrador de credenciales y ACL de archivos .pem / llaves
    "Win32_Security_Credentials",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
] }

# DirectX 11 y DXGI para renderizado por GPU nativo en Windows 11 (DirectFlip)
windows = { version = "0.52", default-features = false, features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }

# Portapapeles del sistema nativo
arboard = "3.6"

# Gestión de errores tipados y contexto en binarios/CLI
thiserror = "2.0"
anyhow = "1.0"

# Configuración ligera en TOML
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"

# Soporte para protocolos gráficos de imagen y visor de imágenes (PNG, JPEG, GIF, WebP, ICO; decodificación base64)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
base64 = "0.22"

# Soporte tipográfico Unicode completo, anchos y clústeres de grafemas
unicode-width = "0.1"
unicode-segmentation = "1.12"

# Optimización de asignaciones en el stack para colecciones pequeñas
smallvec = "1.16"

# Tablas hash de alto rendimiento para claves internas sin riesgo HashDoS
rustc-hash = "2.1"

# Asignador global de memoria de alto rendimiento (Microsoft Research)
mimalloc = { version = "0.1", default-features = false }

# Módulo de bases de datos (feature `db`): PostgreSQL, MySQL/MariaDB y SQL Server sobre un único runtime de tokio
# creado de forma perezosa (en reposo es un hilo bloqueado, 0 % de CPU). TLS con rustls + ring (sin cmake ni nasm);
# SQL Server usa Schannel (tiberius no admite el proveedor de rustls sin arrastrar aws-lc).
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["compat"], optional = true }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"], optional = true }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "tls12", "ring"], optional = true }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "native-tls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
x509-parser = { version = "0.18", default-features = false, optional = true }
pkcs8 = { version = "0.11", features = ["encryption", "std"], optional = true }
ring = { version = "0.17", optional = true }

[features]
default = ["db"]
db = ["dep:tokio", "dep:futures-util", "dep:tokio-util", "dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:mysql_async", "dep:tiberius", "dep:rustls", "dep:webpki-roots", "dep:x509-parser", "dep:pkcs8", "dep:ring"]

# Optimización para binarios de producción (GitHub Releases)
[profile.release]
opt-level = 3           # Máxima optimización de velocidad
lto = "fat"             # Link-Time Optimization: optimiza e inlinea a través de todos los crates
codegen-units = 1       # Compila todo en una sola unidad (compilación más lenta, binario más rápido)
panic = "abort"         # Elimina el código de desenrollado de pila (unwinding), reduciendo tamaño y mejorando caché de CPU
strip = "symbols"       # Limpia símbolos de depuración para un binario ligero

[build-dependencies]
winres = "0.1.12"

[dev-dependencies]
proptest = "1.12.0"
