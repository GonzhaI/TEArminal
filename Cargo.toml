[package]
name = "axon"
version = "0.4.0"
edition = "2021"
description = "Axon: Terminal nativa veloz para Windows optimizada para agentes CLI"
authors = ["Axon Team"]

[dependencies]
# Backend de emulación de terminal y Windows ConPTY
portable-pty = "0.8"
vte = "0.14"

# Ventana nativa y renderizado de alto rendimiento sin capas de GUI
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"

# Integración nativa de Windows 11 (DWM Dark Mode, Win32)
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
    "Win32_System_Diagnostics_ToolHelp",
] }

# Portapapeles del sistema nativo
arboard = "3.6"

# Configuración ligera en TOML
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"

# Soporte para protocolos gráficos de imagen (PNG, JPEG, decodificación base64)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# Soporte tipográfico Unicode completo y anchos de caracteres
unicode-width = "0.1"

# Optimización para binarios de producción (GitHub Releases)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winres = "0.1.12"
