[appearance]
font_family = "JetBrains Mono Nerd Font"
font_size = 13.0
window_opacity = 0.98
theme = "Ghostty Default StyleDark"
line_spacing = 1.0

[terminal]
default_shell = "powershell.exe"
ghostty_prompt = true
scrollback_lines = 50000
bracketed_paste = true
cursor_blink = true
copy_on_select = false
