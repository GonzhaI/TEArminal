# Configuración de ejemplo de TEArminal. Copia este archivo a la carpeta de configuración del usuario
# (%APPDATA%\tearminal\tearminal\config\tearminal.toml), junto a tearminal.exe o al directorio desde el que lo lanzas.
# TEArminal lo genera con estos valores si no existe; todas las claves son opcionales.

[appearance]
font_family = "JetBrains Mono Nerd Font"
# font_path = 'C:\ruta\a\mi-fuente.ttf'   # opcional: sustituye a la fuente embebida
font_size = 13.0
ui_font_size = 13.0
window_opacity = 1.0        # < 1.0 activa ventana en capas (WS_EX_LAYERED): algo más de coste de composición
theme = "Catppuccin Frappe"        # tema oscuro: cualquier tema de iterm2-color-schemes (ej. "Dracula", "TokyoNight")
theme_light = "Catppuccin Latte"   # tema claro
theme_mode = "dark"                # "dark" | "light" | "system" (sigue al tema de Windows y cambia entre los dos anteriores)
line_spacing = 1.2
tab_layout = "horizontal"   # "horizontal" | "vertical"
panel_side = "left"         # lado del panel de navegación: "left" | "right"
show_status_bar = true
show_file_explorer = false

[terminal]
default_shell = "powershell.exe"   # por defecto: pwsh.exe 7 (Program Files) si existe, si no powershell.exe
shell_integration = true              # inyecta el prompt de TEArminal (OSC 7/133, rama git, ls con iconos, agentes)
scrollback_lines = 10000           # la memoria crece con las líneas escritas, no con el máximo
cursor_blink = true
copy_on_select = false
restore_session = true
osc52 = true                     # permite que los programas de la terminal escriban en el portapapeles (OSC 52, máx. 100 KB)
ligatures = true                 # activa ligaduras de programación tipográficas (->, !=, ==, =>...)
auto_check_updates = true        # comprueba automáticamente si hay nuevas versiones al iniciar
ai_limits = true                 # cuotas de Claude: usa la sesión de ~/.claude/.credentials.json (solo lectura) para pedirlas a api.anthropic.com; false = no se lee ni se llama

[database]
prod_read_only = true                     # abre conexiones PROD en solo lectura por defecto (la escritura caduca)
write_window_minutes = 10                 # duración de la escritura habilitada en PROD (en minutos)
written_confirmation = true               # exige teclear el nombre de la conexión antes de aplicar en PROD
warn_no_where = true                      # avisa antes de ejecutar DELETE o UPDATE sin cláusula WHERE
enforce_transaction = true                # ejecuta cambios en una transacción explícita (rollback si algo falla)
backup_original_rows = true               # guarda copia local de las filas originales antes de aplicar cambios
warn_unsafe_pem_permissions = true        # comprueba permisos Windows y avisa si una clave .pem es legible por otros
cert_warn_days = 30                       # días de antelación para avisar de certificados TLS por vencer
certs_folder = "~/.tearminal/certs"       # carpeta de certificados .pem (solo ruta, nunca se copia el contenido)
page_size = 50                            # filas por página en la vista de datos de tablas
query_timeout_seconds = 30                # tiempo máximo de espera para una consulta SQL antes de cancelarla
query_row_limit = 10000                   # límite máximo de filas devueltas para prevenir sobrecarga de memoria
slow_query_threshold_ms = 300             # umbral en milisegundos para marcar una consulta como lenta
autocomplete = true                       # autocompletado de tablas y columnas basado en el esquema leído
save_passwords_in_credential_manager = true # credenciales en el Administrador de Windows (nunca en archivos de texto)
save_query_history = true                 # guarda historial de consultas (solo texto SQL y duración, sin valores)

[performance]
show_cpu = true                           # medidor de uso total de CPU en la barra de estado
show_ram = true                           # medidor de memoria RAM ocupada en la barra de estado
show_gpu = true                           # medidor de GPU 3D en la barra de estado
show_disk = true                          # medidor de espacio en disco usado en la barra de estado
show_net = false                          # medidor de actividad de red en la barra de estado
sample_interval_ms = 2000                 # intervalo de muestreo del monitor del sistema en milisegundos (2 s)
enable_alerts = false                     # alertas visuales cuando un recurso supera el umbral crítico
cpu_alert_threshold = 90                  # umbral porcentual para alerta de CPU (0-100)
ram_alert_threshold = 90                  # umbral porcentual para alerta de RAM (0-100)
disk_alert_threshold = 90                 # umbral porcentual para alerta de Disco (0-100)
