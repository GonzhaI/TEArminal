# Configuración de ejemplo de TEArminal. Copia este archivo a la carpeta de configuración del usuario
# (%APPDATA%\tearminal\tearminal\config\tearminal.toml), junto a tearminal.exe o al directorio desde el que lo lanzas.
# TEArminal lo genera con estos valores si no existe; todas las claves son opcionales.

[appearance]
font_family = "JetBrains Mono Nerd Font"
# font_path = 'C:\ruta\a\mi-fuente.ttf'   # opcional: sustituye a la fuente embebida
font_size = 13.0
ui_font_size = 13.0
window_opacity = 1.0        # < 1.0 activa ventana en capas (WS_EX_LAYERED): algo más de coste de composición
theme = "Catppuccin Frappe"        # tema oscuro: cualquier tema de iterm2-color-schemes (ej. "Dracula", "TokyoNight")
theme_light = "Catppuccin Latte"   # tema claro
theme_mode = "dark"                # "dark" | "light" | "system" (sigue al tema de Windows y cambia entre los dos anteriores)
line_spacing = 1.2
tab_layout = "horizontal"   # "horizontal" | "vertical"
panel_side = "left"         # lado del panel de navegación: "left" | "right"
show_status_bar = true
show_file_explorer = false

[terminal]
default_shell = "powershell.exe"   # por defecto: pwsh.exe 7 (Program Files) si existe, si no powershell.exe
shell_integration = true              # inyecta el prompt de TEArminal (OSC 7/133, rama git, ls con iconos, agentes)
scrollback_lines = 10000           # la memoria crece con las líneas escritas, no con el máximo
cursor_blink = true
copy_on_select = false
restore_session = true
osc52 = true                     # permite que los programas de la terminal escriban en el portapapeles (OSC 52, máx. 100 KB)
ligatures = true                 # activa ligaduras de programación tipográficas (->, !=, ==, =>...)
gpu = true                       # sin efecto: el render por GPU (Direct3D 11, con WARP de respaldo) es el único; se conserva por compatibilidad
auto_check_updates = true        # comprueba automáticamente si hay nuevas versiones al iniciar
ai_limits = true                 # cuotas de Claude: usa la sesión de ~/.claude/.credentials.json (solo lectura) para pedirlas a api.anthropic.com; false = no se lee ni se llama
